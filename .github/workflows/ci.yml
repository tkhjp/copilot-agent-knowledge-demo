name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate tests and agent knowledge
        shell: bash
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-check-log
          path: check.log
          if-no-files-found: error
