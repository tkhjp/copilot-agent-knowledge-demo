name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-tree-sitter-design:
    if: github.event_name == 'pull_request' && github.head_ref == 'docs/tree-sitter-graph-update-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply documentation corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/tree-sitter-code-graph-update-sync-design.ja.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace("-主要 module / dependency の概要", "- 主要 module / dependency の概要")
          text = text.replace("-新規 parse error がない、または policy 内", "- 新規 parse error がない、または policy 内")

          text = text.replace(
              "          ref: ${{ github.event.pull_request.head.sha }}\n\n"
              "      - name: Generate exact PR graph",
              "          ref: ${{ github.event.pull_request.head.sha }}\n"
              "          fetch-depth: 0\n\n"
              "      - name: Capture exact PR source SHA\n"
              "        run: echo \"SOURCE_SHA=${{ github.event.pull_request.head.sha }}\" >> \"$GITHUB_ENV\"\n\n"
              "      - name: Generate exact PR graph",
          )
          text = text.replace(
              '--source-commit "${GITHUB_SHA}"',
              '--source-commit "${SOURCE_SHA}"',
              1,
          )

          old_head_check = '''      - name: Verify this is still current HEAD
                env:
                  SOURCE_SHA: ${{ github.sha }}
                run: |
                  git fetch origin develop
                  CURRENT_HEAD="$(git rev-parse origin/develop)"
                  if [ "$CURRENT_HEAD" != "$SOURCE_SHA" ]; then
                    echo "Newer commit exists. Skip latest publication."
                    exit 78
                  fi

              - name: Publish repository snapshot
                run: |
          '''
          new_head_check = '''      - name: Verify this is still current HEAD
                id: current
                env:
                  SOURCE_SHA: ${{ github.sha }}
                run: |
                  git fetch origin develop
                  CURRENT_HEAD="$(git rev-parse origin/develop)"
                  if [ "$CURRENT_HEAD" = "$SOURCE_SHA" ]; then
                    echo "publish=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "publish=false" >> "$GITHUB_OUTPUT"
                    echo "Newer commit exists. Keep the snapshot result, but do not update the shared latest graph."
                  fi

              - name: Publish repository snapshot
                if: steps.current.outputs.publish == 'true'
                run: |
          '''
          text = text.replace(old_head_check, new_head_check)

          text = text.replace(
              "実装時は `exit 78` を job 成功扱いにする step 制御、または output flag に置き換えます。重要なのは、古い run が latest snapshot を更新しないことです。",
              "この例では output flag により、古い run を失敗扱いにせず publish step だけを停止します。さらに、head check 後に default branch が更新された場合も、通常の `git push` が non-fast-forward で失敗するため、古い graph commit が新しい source commit を上書きしません。",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tree-sitter-code-graph-update-sync-design.ja.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: correct tree-sitter workflow examples"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate tests and agent knowledge
        run: make check

      - name: Validate Wiki export
        shell: bash
        run: |
          set -euo pipefail
          make wiki-export
          test -f dist/wiki/Tree-Sitter-Code-Graph-Update-Sync-Design-JA.md
          test -f dist/wiki/Shared-Project-Knowledge-Management-Design-JA.md
          test -f dist/wiki/Home.md
          test -f dist/wiki/_Sidebar.md
          grep -q 'Tree Sitter Code Graph Update Sync Design JA' dist/wiki/Home.md
          grep -q 'Tree Sitter Code Graph Update Sync Design JA' dist/wiki/_Sidebar.md
          grep -q 'Shared Project Knowledge Management Design JA' dist/wiki/Home.md
          grep -q 'Shared Project Knowledge Management Design JA' dist/wiki/_Sidebar.md

      - name: Validate knowledge feedback issue form
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/ISSUE_TEMPLATE/knowledge-feedback.yml
          grep -q '^name: Knowledge feedback$' .github/ISSUE_TEMPLATE/knowledge-feedback.yml
          grep -q '^body:$' .github/ISSUE_TEMPLATE/knowledge-feedback.yml
