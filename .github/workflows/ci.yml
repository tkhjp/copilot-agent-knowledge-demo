name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate tests and agent knowledge
        run: make check

      - name: Validate Wiki export
        shell: bash
        run: |
          set -euo pipefail
          make wiki-export
          test -f dist/wiki/Shared-Project-Knowledge-Management-Design-JA.md
          test -f dist/wiki/Home.md
          test -f dist/wiki/_Sidebar.md
