name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  repair-graph-archive:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/fix-graph-verification' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Regenerate graph archives on the runner
        run: make knowledge

      - name: Commit repaired archives when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- artifacts/codegraph docs/agent-knowledge/generated; then
            echo "Graph archives already portable"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/codegraph docs/agent-knowledge/generated
          git commit -m "regenerate graph archives on GitHub runner"
          git push

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate tests and agent knowledge
        shell: bash
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-check-log
          path: check.log
          if-no-files-found: error
