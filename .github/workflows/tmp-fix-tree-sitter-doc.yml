name: Temporary Fix Tree-sitter Design

on:
  push:
    branches:
      - docs/tree-sitter-graph-update-sync
    paths:
      - ".github/workflows/tmp-fix-tree-sitter-doc.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/tree-sitter-graph-update-sync
          fetch-depth: 0

      - name: Apply documentation corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/tree-sitter-code-graph-update-sync-design.ja.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace("-主要 module / dependency の概要", "- 主要 module / dependency の概要")
          text = text.replace("-新規 parse error がない、または policy 内", "- 新規 parse error がない、または policy 内")

          text = text.replace(
              '''      - uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}

                - name: Generate exact PR graph
                  run: |
                    ./tools/codegraph/generate \\
                      --source-commit "${GITHUB_SHA}" \\
                      --mode full \\
                      --output .agent-runtime/pr-graph
''',
              '''      - uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}
                    fetch-depth: 0

                - name: Capture exact PR source SHA
                  run: echo "SOURCE_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

                - name: Generate exact PR graph
                  run: |
                    ./tools/codegraph/generate \\
                      --source-commit "${SOURCE_SHA}" \\
                      --mode full \\
                      --output .agent-runtime/pr-graph
''',
          )

          text = text.replace(
              '''      - name: Verify this is still current HEAD
                  env:
                    SOURCE_SHA: ${{ github.sha }}
                  run: |
                    git fetch origin develop
                    CURRENT_HEAD="$(git rev-parse origin/develop)"
                    if [ "$CURRENT_HEAD" != "$SOURCE_SHA" ]; then
                      echo "Newer commit exists. Skip latest publication."
                      exit 78
                    fi

                - name: Publish repository snapshot
                  run: |
''',
              '''      - name: Verify this is still current HEAD
                  id: current
                  env:
                    SOURCE_SHA: ${{ github.sha }}
                  run: |
                    git fetch origin develop
                    CURRENT_HEAD="$(git rev-parse origin/develop)"
                    if [ "$CURRENT_HEAD" = "$SOURCE_SHA" ]; then
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "Newer commit exists. Keep the snapshot result, but do not update the shared latest graph."
                    fi

                - name: Publish repository snapshot
                  if: steps.current.outputs.publish == 'true'
                  run: |
''',
          )

          text = text.replace(
              "実装時は `exit 78` を job 成功扱いにする step 制御、または output flag に置き換えます。重要なのは、古い run が latest snapshot を更新しないことです。",
              "この例では output flag により、古い run を失敗扱いにせず publish step だけを停止します。さらに、head check 後に default branch が更新された場合も、通常の `git push` が non-fast-forward で失敗するため、古い graph commit が新しい source commit を上書きしません。",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tree-sitter-code-graph-update-sync-design.ja.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: correct tree-sitter workflow examples"
          git push origin HEAD:docs/tree-sitter-graph-update-sync
