name: Mirror Knowledge to Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "docs/agent-knowledge/**"
      - "tools/knowledge/export_wiki.py"
      - ".github/workflows/mirror-wiki.yml"

permissions:
  contents: write

concurrency:
  group: mirror-agent-knowledge-wiki
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Export Wiki pages
        run: make wiki-export

      - name: Initialize or clone Wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if git clone "$wiki_url" wiki; then
            echo "Existing Wiki repository cloned"
          else
            echo "No initialized Wiki repository was available; creating the first Wiki commit"
            rm -rf wiki
            mkdir wiki
            git -C wiki init -b master
            git -C wiki remote add origin "$wiki_url"
          fi

      - name: Publish Wiki mirror
        shell: bash
        run: |
          set -euo pipefail

          find wiki -mindepth 1 -maxdepth 1 -type f -name '*.md' -delete
          cp dist/wiki/*.md wiki/

          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add -A

          if git -C wiki diff --cached --quiet; then
            echo "Wiki already current"
            exit 0
          fi

          git -C wiki commit -m "mirror agent knowledge from ${GITHUB_SHA}"
          git -C wiki push --set-upstream origin HEAD:master

      - name: Record successful Wiki initialization
        shell: bash
        run: |
          set -euo pipefail
          marker=".github/wiki-mirror-initialized.md"

          if [[ -f "$marker" ]]; then
            echo "Initialization marker already exists"
            exit 0
          fi

          cat > "$marker" <<EOF
          # Wiki mirror initialized

          The `Mirror Knowledge to Wiki` workflow successfully published the repository's Agent Knowledge Pack to:

          <https://github.com/${GITHUB_REPOSITORY}/wiki>

          Initial source commit: `${GITHUB_SHA}`

          The repository knowledge files remain authoritative for agents. The Wiki is the human-facing mirror.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "record successful Wiki initialization"
          git push
