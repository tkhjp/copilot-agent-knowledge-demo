name: Mirror Knowledge to Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Export Wiki pages
        run: make wiki-export

      - name: Publish Wiki mirror
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone "$wiki_url" wiki; then
            echo "Initialize the Wiki with one page in the GitHub UI, then rerun this workflow." >&2
            exit 1
          fi
          find wiki -mindepth 1 -maxdepth 1 -type f -name '*.md' -delete
          cp dist/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already current"
            exit 0
          fi
          git commit -m "mirror agent knowledge"
          git push
