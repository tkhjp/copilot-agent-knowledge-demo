name: Mirror Knowledge to Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "docs/agent-knowledge/**"
      - "docs/tree-sitter-code-graph-update-sync-design.ja.md"
      - "docs/shared-project-knowledge-management-design.ja.md"
      - "docs/agents-tab-demo.ja.md"
      - "docs/wiki.ja.md"
      - "tools/knowledge/export_wiki.py"
      - ".github/ISSUE_TEMPLATE/knowledge-feedback.yml"

permissions:
  contents: write

concurrency:
  group: mirror-agent-knowledge-wiki
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Export Wiki pages
        run: make wiki-export

      - name: Clone initialized Wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone "$wiki_url" wiki; then
            echo "::error title=Wiki not initialized::Create the first page at https://github.com/${GITHUB_REPOSITORY}/wiki, then rerun this workflow. GitHub does not create the .wiki.git repository until the first page is saved."
            exit 1
          fi

      - name: Publish managed Wiki pages
        shell: bash
        run: |
          set -euo pipefail

          managed_manifest="wiki/.managed-pages"

          # Remove only pages managed by the previous mirror run. Manual Wiki
          # pages remain untouched and can be used for human discussion notes.
          if [[ -f "$managed_manifest" ]]; then
            while IFS= read -r page; do
              [[ -z "$page" ]] && continue
              rm -f "wiki/$page"
            done < "$managed_manifest"
          else
            # First migration from the old all-pages-managed workflow: replace
            # only files that the current exporter owns.
            while IFS= read -r exported; do
              rm -f "wiki/$(basename "$exported")"
            done < <(find dist/wiki -maxdepth 1 -type f -name '*.md' | sort)
          fi

          cp dist/wiki/*.md wiki/
          find dist/wiki -maxdepth 1 -type f -name '*.md' -printf '%f\n' \
            | sort > "$managed_manifest"

          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add -A

          if git -C wiki diff --cached --quiet; then
            echo "Wiki already current"
            exit 0
          fi

          git -C wiki commit -m "mirror agent knowledge from ${GITHUB_SHA}"
          git -C wiki push origin HEAD:master
