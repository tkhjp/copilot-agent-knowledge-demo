name: Apply graph verification fix

on:
  push:
    branches:
      - agent/fix-graph-verification
    paths:
      - ".ci-fix/**"
      - ".github/workflows/apply-graph-verification-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4

      - name: Extract reviewed fix payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-fix/payload.part.* | base64 --decode > /tmp/ci-fix.tar.gz
          echo "e24ec710741974b7e0637612af240463168ed8ed0fd402725324f5a70c527566  /tmp/ci-fix.tar.gz" | sha256sum --check -
          tar -xzf /tmp/ci-fix.tar.gz -C .
          rm -rf .ci-fix
          rm -f .github/workflows/apply-graph-verification-fix.yml

      - name: Validate fix
        run: make check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix cross-runtime graph verification"
          git push
