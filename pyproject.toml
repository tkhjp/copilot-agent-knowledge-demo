[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-agent-knowledge-demo"
version = "0.1.0"
description = "Executable demo of fresh, shared repository knowledge for GitHub Copilot agents"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Demo maintainers" }]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
